services:
  - type: web
    name: senryu-kukai
    runtime: ruby
    plan: starter
    region: singapore
    buildCommand: "./bin/render-build.sh"
    preDeployCommand: "bundle exec rails db:migrate"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: senryu-kukai-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: APP_HOST
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MAIL_DOMAIN
        sync: false
      - key: MAILER_SENDER
        sync: false
      - key: SES_SMTP_USERNAME
        sync: false
      - key: SES_SMTP_PASSWORD
        sync: false

databases:
  - name: senryu-kukai-db
    plan: basic-256mb
    region: singapore
